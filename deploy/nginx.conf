# NGINX Configuration for Conservation Trips & Adventures
# Place this in your /etc/nginx/sites-available/ or include it in your server block.

server {
    listen 80;
    server_name tripsandadventures.co.ug www.tripsandadventures.co.ug;

    # Point to the 'dist' folder for static files
    root /var/www/conservation-trips/dist;
    index index.html;

    # 1. Serve static assets with long cache
    location /css/ { expires 30d; add_header Cache-Control "public, no-transform"; }
    location /js/ { expires 30d; add_header Cache-Control "public, no-transform"; }
    location /images/ { expires 30d; add_header Cache-Control "public, no-transform"; }

    # 2. Handle standard routes (serving static HTML from dist)
    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }

    # 3. Proxy dynamic form submissions to the Node.js backend
    location /contact/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Error pages
    error_page 404 /404.html;
    location = /404.html { internal; }
}

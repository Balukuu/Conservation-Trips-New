# NGINX configuration for Conservation Trips & Adventures
# Place this in /etc/nginx/sites-available/ or include it in your server block.
#
# Layout: nginx serves the static build (`npm run build` -> dist/) and proxies
# only the form endpoints to the Node app (`npm start`, port 3000).
# To have the static pages post to that Node app, build with:
#     FORM_ENDPOINT=/contact/submit npm run build
# (without FORM_ENDPOINT the static forms fall back to a mailto: draft).
# Set TRUST_PROXY=1 (the default when NODE_ENV=production) so rate limiting
# sees real visitor IPs.

server {
    listen 80;
    server_name tripsandadventures.co.ug www.tripsandadventures.co.ug;

    root /var/www/conservation-trips/dist;
    index index.html;

    # 1. Compression for text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 2. Caching
    # CSS/JS URLs carry a content hash (?v=...), so they can be cached for a year.
    location ~* \.(css|js|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Pages (static HTML from dist). Folder URLs are canonical (/tours/ serves
    #    tours/index.html; nginx adds the slash to /tours), so /x/index.html redirects there.
    location ~ ^(.*/)index\.html$ {
        return 301 $1;
    }
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 4. Form submissions -> Node backend (POST only)
    location ~ ^/contact/(booking|enquiry|submit)$ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    # 5. Error pages
    error_page 404 /404.html;
    location = /404.html { internal; }
}
